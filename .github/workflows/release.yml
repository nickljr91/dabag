name: Release

# Pushing a tag such as v1.0.1 builds the addon zip, attaches it to a GitHub release,
# and uploads it to CurseForge when the CF_API_KEY secret and the project ID in the TOC are set.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
